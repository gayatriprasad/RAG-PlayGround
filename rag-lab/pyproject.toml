[project]
name = "raglab"
version = "0.1.0"
description = "RAG learning laboratory"
requires-python = ">=3.10"
dependencies = [
  "pyyaml",
  "pydantic>=2",
  "tqdm",
  "psutil",
  "numpy",
  "pypdf",
  "pdfplumber",
  "python-docx",
]

[project.scripts]
raglab-run = "raglab.run_experiment:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "raglab"
version = "0.1.0"
description = "NeuralBench — RAG research platform"
requires-python = ">=3.11"
dependencies = [
  "pyyaml",
  "pydantic>=2",
  "tqdm",
  "psutil",
  "numpy",
  "pypdf",
  "pdfplumber",
  "python-docx",
  "beautifulsoup4",
  "huggingface-hub",
  "datasets",
  "tiktoken",
  "spacy",
  "nltk",
  "openai",
  "chromadb",
  "sentence-transformers",
  "rank-bm25",
  "flashrank",
  "transformers",
  "sentencepiece",
  "torch",
  "pandas",
  "tabulate",
  "typer",
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "tenacity",
  "slowapi",
  "python-multipart",
  "diskcache",
  "networkx",
  "scipy",
  "statsmodels",
  "scikit-learn",
  "rapidfuzz",
]

[project.optional-dependencies]

# Agents + orchestration
agents = [
  "langgraph>=0.1.0",
  "langchain-core>=0.2.0",
]

# Observability
observability = [
  "langfuse>=2.0.0",
  "arize-phoenix",
  "traceloop-sdk",
  "fastmcp",
]

# Additional LLM providers
providers = [
  "anthropic>=0.25.0",
  "groq>=0.5.0",
  "google-generativeai",
]

# Extended vector DB backends
vectordb = [
  "faiss-cpu>=1.7.0",
  "pymilvus>=2.3.0",
  "pinecone-client>=6.0.0",
  "weaviate-client>=4.0.0",
  "qdrant-client>=1.7.0",
  "psycopg2-binary>=2.9.0",
  "pgvector>=0.2.0",
  "psycopg[binary]",
  "psycopg-pool",
]

# Retrieval extras
retrieval = [
  "ragatouille",
  "RestrictedPython",
]

# Visualization
viz = [
  "umap-learn>=0.5.0",
  "plotly>=5.0.0",
]

# Document parsing extras
parsing = [
  "marker-pdf",
  "surya-ocr",
]

# Dev tools
dev = [
  "pytest>=7.0",
  "pytest-asyncio",
  "pytest-cov",
  "respx",
  "ruff",
  "mypy",
  "pre-commit",
  "mutmut>=3.0",
]

# Everything
all = [
  "langgraph>=0.1.0",
  "langchain-core>=0.2.0",
  "langfuse>=2.0.0",
  "arize-phoenix",
  "traceloop-sdk",
  "fastmcp",
  "anthropic>=0.25.0",
  "groq>=0.5.0",
  "google-generativeai",
  "faiss-cpu>=1.7.0",
  "pymilvus>=2.3.0",
  "pinecone-client>=6.0.0",
  "weaviate-client>=4.0.0",
  "qdrant-client>=1.7.0",
  "psycopg2-binary>=2.9.0",
  "pgvector>=0.2.0",
  "psycopg[binary]",
  "psycopg-pool",
  "ragatouille",
  "RestrictedPython",
  "umap-learn>=0.5.0",
  "plotly>=5.0.0",
  "marker-pdf",
  "surya-ocr",
]

[project.scripts]
raglab-run = "raglab.run_experiment:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Baseline measured 2026-08-11: raglab 39%, floor 37% (−2 margin).
# pytest-cov 7.x --cov-fail-under exits 0 on failure; CI uses `coverage report --fail-under=37`.
addopts = "--cov=raglab --cov-report=term-missing"
markers = [
  "test_live_registries: marks tests that require live network/Ollama (excluded from fast CI path)",
]

[tool.mutmut]
# Scope mutation to the three modules that had real bugs found this session
source_paths = [
  "src/raglab/config.py",
  "src/raglab/db/writer.py",
  "src/raglab/index/chroma_index.py",
]
# Copy siblings that mutated files import from, plus test fixtures
also_copy = ["src/raglab", "presets", "experiments", "golden"]
# Exclude live-integration tests from mutation runs; they need Ollama/network
pytest_add_cli_args = [
  "-k", "not test_integration_e2e and not test_extended_combinations and not test_live_registries and not test_real_ollama_integration",
]
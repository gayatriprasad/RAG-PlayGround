experiment:
  name: "02_retrieval_comparison_hybrid"
  corpus_glob: ["corpus/raw/**/*.txt", "corpus/raw/**/*.md"]
  representations: ["chroma", "pageindex", "hybrid"]

chunk:
  strategy: "fixed"
  chunk_tokens: 512
  overlap: 50

retrieve:
  top_k: 5
  similarity_threshold: 0.0
  rerank: false
  reranker: "none"
  reranker_model: "ms-marco-MiniLM-L-12-v2"
  confidence_threshold: 0.35
  use_cache: true
  cache_ttl_seconds: 3600
  cache_mode: "exact"

golden:
  path: "./golden/questions.jsonl"

embed:
  model: "all-MiniLM-L6-v2"
  device: "cpu"

index:
  backend: "hybrid"
  persist_dir: "./out/hybrid"
  rrf_k: 60
  hybrid_dense_weight: 0.7
  hybrid_sparse_weight: 0.3

intent:
  mode: "hybrid"
  llm_model: "llama3.2:1b"
  simple_threshold: 0.8
  max_sub_queries: 4

agentic:
  strategy: "decompose"

generation:
  mode: "strict_rag"
  citation_mode: "chunk_id"

confidence:
  scorer: "composite"
  fallback_message: "INSUFFICIENT EVIDENCE: confidence too low to answer reliably."

llm:
  model: "llama3.2:1b"
  temperature: 0.0
  max_tokens: 512
  provider: "ollama"
  ollama_base_url: "http://localhost:11434/v1"

benchmark:
  questions_path: "./golden/questions.jsonl"
  source_types: ["confluence", "github", "jira", "slack"]
  max_questions: 50

eval:
  metrics: ["llm_judge"]

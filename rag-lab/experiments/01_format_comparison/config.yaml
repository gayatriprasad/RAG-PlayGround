experiment:
  name: "01_format_comparison"
  corpus_glob:
    - "corpus/raw/confluence/*.txt"
    - "corpus/raw/github/*.txt"
    - "corpus/raw/slack/*.txt"
  representations: ["text"]

chunk:
  strategy: "fixed"
  chunk_tokens: 512
  overlap: 50

retrieve:
  top_k: 5
  rerank: false
  confidence_threshold: 0.15

intent:
  mode: "hybrid"
  llm_model: "llama3"

llm:
  provider: "ollama"
  model: "llama3"
  ollama_base_url: "http://localhost:11434/v1"

golden:
  path: "golden/questions.jsonl"

benchmark:
  questions_path: "golden/questions.jsonl"
  source_types: ["confluence", "github", "slack"]
  max_questions: 20
